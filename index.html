<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustKart Grocery</title>

  <!-- Favicon & App Icon -->
  <link rel="icon" href="https://base44.app/api/apps/69abb9de713c0513da7900b8/files/mp/public/69abb9de713c0513da7900b8/cad19433a_1000046550.jpg">
  <link rel="apple-touch-icon" href="https://base44.app/api/apps/69abb9de713c0513da7900b8/files/mp/public/69abb9de713c0513da7900b8/cad19433a_1000046550.jpg">
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  
  <!-- iOS / Apple Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrustKart Grocery">

  <!-- OneSignal Push Notification Script -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "f2e5db9f-4c15-4b8a-9a28-24323d8d5af4",
        slidedown: {
          prompts: [
            {
              type: "push",
              autoPrompt: true,
              text: {
                actionMessage: "TrustKart Grocery से नए ऑफर्स और डिस्काउंट के अपडेट पाएं!",
                acceptButton: "चालू करें (Allow)",
                cancelButton: "बाद में"
              }
            }
          ]
        }
      });
    });
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- TrustKart Store Embed -->
  <iframe src="https://myshop123vk-cell.github.io/T" allow="geolocation; microphone; camera"></iframe>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('TrustKart PWA Registered!'))
          .catch(err => console.log('Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
